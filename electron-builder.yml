appId: io.github.relic
productName: Relic
files:
  - build/**/*
  - node_modules/**/*
  - '!build/bin/*'
  - build/bin/legendary.LICENSE

asarUnpack:
  - build/icon.png
  - build/icon-dark.png
  - build/icon-light.png
  - build/bin/**/*
  - '!build/bin/legendary.LICENSE'

protocols:
  - name: relic
    schemes:
      - relic

linux:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  category: Game
  icon: build/icon.icns
  desktop:
    entry:
      Name: Relic
      Comment: A minimalist game installer for GOG, Epic Games and Amazon Games. Fork of Heroic.
  target:
    - AppImage
  files:
    - build/bin/${arch}/linux/*
    - build/bin/x64/win32/GalaxyCommunication.exe
    - build/bin/x64/win32/EpicGamesLauncher.exe
